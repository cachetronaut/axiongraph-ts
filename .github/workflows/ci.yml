name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: axiongraph
          POSTGRES_PASSWORD: axiongraph
          POSTGRES_DB: axiongraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AXIONGRAPH_TEST_POSTGRES_URL: postgres://axiongraph:axiongraph@localhost:5432/axiongraph_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout DockBay sibling
        run: |
          mkdir -p ../../dockbay
          git clone --depth 1 https://github.com/cachetronaut/dockbay-ts.git ../../dockbay/dockbay-ts

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: npm pack --dry-run

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
