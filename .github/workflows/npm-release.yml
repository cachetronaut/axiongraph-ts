name: npm Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump to publish"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release-main
  cancel-in-progress: false

jobs:
  release:
    if: "${{ github.event_name == 'workflow_dispatch' || (!startsWith(github.event.head_commit.message, 'chore: release v') && !contains(github.event.head_commit.message, '[skip release]')) }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      - name: Select version bump
        id: bump
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.bump }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=patch" >> "$GITHUB_OUTPUT"
          fi

      # Both published packages share one version. Bump @axiongraph/core, then pin
      # @axiongraph/store-local to the same version so the tag and the two packages agree.
      - name: Bump version
        id: version
        run: |
          VERSION="$(cd packages/core && npm version "${{ steps.bump.outputs.value }}" --no-git-tag-version | sed 's/^v//')"
          (cd packages/store-local && npm version "${VERSION}" --no-git-tag-version --allow-same-version)
          pnpm install --lockfile-only
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists." >&2
            exit 1
          fi
          for pkg in @axiongraph/core @axiongraph/store-local; do
            if npm view "${pkg}@${VERSION}" version >/dev/null 2>&1; then
              echo "${pkg}@${VERSION} already exists on npm." >&2
              exit 1
            fi
          done
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          pnpm build
          pnpm -r publish --no-git-checks --dry-run

      - name: Commit version and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core/package.json packages/store-local/package.json pnpm-lock.yaml
          git commit -m "chore: release ${{ steps.version.outputs.tag }}"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin HEAD:main "${{ steps.version.outputs.tag }}"

      # Multi-package + workspace:* deps need pnpm's workspace-aware publish (it rewrites
      # workspace:* to the concrete version and applies publishConfig). Unlike houndex's
      # single-package keyless publish, this uses an NPM_TOKEN secret; --provenance still
      # signs via the id-token. Configure the NPM_TOKEN secret and grant the token publish
      # access to @axiongraph/core and @axiongraph/store-local.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm -r publish --access public --no-git-checks --provenance
